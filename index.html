<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conference Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 24" width="28" height="21" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M2 17 H30" stroke-opacity="0.55" />
        <path d="M5 17 C10 4, 22 4, 27 17" />
        <circle cx="16" cy="9.2" r="1.4" fill="currentColor" stroke="none" />
      </svg>
    </span>
    <span class="brand-text">
      <span class="brand-title" data-i18n="app.title">Трекер конференций</span>
      <span class="brand-sub" data-i18n="app.subtitle">Конференции и научные работы</span>
    </span>
  </div>
  <div class="header-actions">
    <input id="search" class="search" type="search" data-i18n-ph="search.placeholder" />
    <button id="addBtn" class="btn" data-i18n="btn.add">+ Добавить</button>
    <button id="updateBtn" class="btn" data-i18n="btn.update">⟳ Обновить базу</button>
    <button id="syncBtn" class="btn" data-i18n="btn.sync">☁ Синхронизация</button>
    <button id="themeBtn" class="btn" data-i18n="btn.theme">Тема</button>
    <button id="langBtn" class="btn">EN</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="future" role="tab"><span data-i18n="tab.future">Будущие</span><span class="tab-count" data-count="future">0</span></button>
  <button class="tab-btn" data-tab="now" role="tab"><span class="live-dot" aria-hidden="true"></span><span data-i18n="tab.now">Сейчас идут</span><span class="tab-count tab-count--live" data-count="now">0</span></button>
  <button class="tab-btn" data-tab="past" role="tab"><span data-i18n="tab.past">Прошедшие</span><span class="tab-count" data-count="past">0</span></button>
  <button class="tab-btn" data-tab="papers" role="tab"><span data-i18n="tab.papers">Статьи</span><span class="tab-count" data-count="papers">0</span></button>
  <button class="tab-btn" data-tab="calendar" role="tab"><span data-i18n="tab.calendar">Календарь</span></button>
</nav>

<div id="pastFilters" class="filters" hidden>
  <select id="pastFormat"></select>
  <select id="pastAtt"></select>
  <select id="pastTag"></select>
  <select id="pastSort">
    <option value="date" data-i18n="filter.sortDate">По дате</option>
    <option value="rating" data-i18n="filter.sortRating">По оценке</option>
    <option value="title" data-i18n="filter.sortTitle">По названию</option>
  </select>
</div>

<main class="content">
  <section id="tab-future" class="tab-panel"></section>
  <section id="tab-now" class="tab-panel" hidden></section>
  <section id="tab-past" class="tab-panel" hidden></section>
  <section id="tab-papers" class="tab-panel" hidden></section>
  <section id="tab-calendar" class="tab-panel" hidden></section>
</main>

<!-- Modal -->
<div id="modal" class="modal-overlay" hidden>
  <div class="modal">
    <h2 id="modal-title" data-i18n="modal.addTitle">Новая запись</h2>
    <div id="modal-form" class="modal-form"></div>
    <div class="modal-buttons">
      <button id="modalSave" class="btn btn-primary" data-i18n="btn.save">Сохранить</button>
      <button id="modalCancel" class="btn" data-i18n="btn.cancel">Отмена</button>
      <button id="modalDelete" class="btn danger" data-i18n="btn.delete">Удалить</button>
    </div>
  </div>
</div>

<!-- Sync panel -->
<div id="syncPanel" class="modal-overlay" hidden>
  <div class="modal">
    <h2 data-i18n="sync.title">Синхронизация</h2>
    <label class="m-field"><span data-i18n="sync.token">GitHub токен</span><input name="token" type="password" autocomplete="off"></label>
    <p class="hint" data-i18n="sync.tokenHint">Подсказка по scope</p>
    <label class="m-field"><span data-i18n="sync.gistId">Gist ID</span><input name="gistId" type="text"></label>
    <div class="m-row">
      <label class="m-field"><span data-i18n="sync.owner">Owner</span><input name="owner" type="text"></label>
      <label class="m-field"><span data-i18n="sync.repo">Repo</span><input name="repo" type="text"></label>
    </div>
    <label class="m-check"><input name="auto" type="checkbox"> <span data-i18n="sync.auto">Автосинхронизация</span></label>
    <div class="modal-buttons">
      <button id="syncPush" class="btn" data-i18n="sync.push">Выгрузить ↑</button>
      <button id="syncPull" class="btn" data-i18n="sync.pull">Загрузить ↓</button>
      <button id="syncClose" class="btn" data-i18n="btn.close">Закрыть</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/modal.js"></script>
<script src="js/calendar.js"></script>
<script src="js/import-helpers.js"></script>
<script src="js/import-data.js"></script>
<script src="js/import.js"></script>
<script src="js/ics.js"></script>
<script src="js/update.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
