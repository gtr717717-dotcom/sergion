name: Update data

on:
  repository_dispatch:
    types: [update-data]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build import-data.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-import-data.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/import-data.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh import-data.js"
            git push
          fi
